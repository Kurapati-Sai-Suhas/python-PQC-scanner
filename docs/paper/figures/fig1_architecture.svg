   <g id="text_1">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(8.700875 82.2475)">Python repository</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(17.704 92.2475)">(parsed only;</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(13.115875 102.2475)">never imported</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(18.74025 112.551875)">or executed)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(160.231125 45.131375)">A  Detect</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(125.269875 54.4795)">Semgrep CE 1.185.0 rules:</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(131.112375 64.846375)">candidate sites, rule ids</text>
   </g>
   <g id="text_3">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(135.39175 114.4545)">B  Semantic evidence</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(120.9305 123.6795)">imports and aliases, receiver</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(121.861125 133.6795)">typing, arguments, bounded</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(110.103625 143.6795)">provenance and consumer tracing</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(117.849875 153.983875)">(≤ 2 call levels, same module)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(300.184625 84.3585)">C  Roles</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(286.98525 94.3585)">decision table:</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(284.617125 104.3585)">role + evidence</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(296.1915 114.3585)">tier T0–T3</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(281.794625 123.887875)">(4 ablation arms)</text>
   </g>
   <g id="text_5">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(377.22325 83.5835)">D  Policy v1.1</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(379.68075 93.950375)">role → class,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(389.790125 103.87975)">τ = T2,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(372.481375 114.3585)">NIST-referenced</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(386.57075 124.3585)">rationale</text>
   </g>
   <g id="text_6">
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(465.243625 83.460375)">E  Export</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(472.276125 93.544125)">JSON,</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(454.0405 103.5835)">CycloneDX 1.6</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(460.414875 113.887875)">(validated),</text>
    <text style="font-size: 8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(460.34925 124.287875)">SARIF 2.1.0</text>
   </g>
   <g id="text_7">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="264.384" y="50.638406" transform="rotate(-0 264.384 50.638406)">rule ids joined by location</text>
   </g>
   <g id="text_8">
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(318.576281 162.663602)">per site: RECOMMEND (SIG / KEM / KEM_DEM)</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(304.450875 170.82493)">FLAG_NO_TARGET (INVENTORY / PROTOCOL_REVIEW /</text>
    <text style="font-size: 6.8px; font-family: 'DejaVu Sans'; fill: #52514e" transform="translate(343.055219 178.986258)">NO_ACTION_HYBRID) · ABSTAIN</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 8px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="10.368" y="213.84" transform="rotate(-0 10.368 213.84)">Evaluation tooling (not part of a scan)</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(78.056953 243.183938)">F  Benchmark and statistics</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(37.445156 252.178313)">sampler (strata, cap, B0) · hash-chained ledger ·</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(42.187922 261.928313)">packet builder · frozen judge · equal-coverage</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(40.571859 271.678313)">matching · bootstrap, guard, gate, Holm (F-B) ·</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(28.178391 281.428313)">exact McNemar + Holm (F-A) · reliability, frame audit</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(362.140125 243.183938)">G  Baselines</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(296.38125 252.178313)">simple mappings on the same candidate sites</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(311.471203 261.928313)">(algorithm-name, method/argument) ·</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(310.607109 271.678313)">adapters for six pinned external tools ·</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(330.228375 281.428313)">measured file-failure profiles</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="259.2" y="11.088" transform="rotate(-0 259.2 11.088)">Fig. 1  pqscan architecture (Modules A–E scan; F–G evaluation)</text>
   </g>
  </g>
 </g>
