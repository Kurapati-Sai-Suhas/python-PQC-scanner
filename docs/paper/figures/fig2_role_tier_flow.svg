   <g id="text_1">
    <text style="font-weight: 700; font-size: 9.5px; font-family: 'DejaVu Sans'; text-anchor: middle" x="259.2" y="10.08" transform="rotate(-0 259.2 10.08)">Fig. 2  Role inference, evidence tier and policy decision (arm `full`)</text>
   </g>
   <g id="text_2">
    <text style="font-size: 8.5px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #0b0b0b" x="259.2" y="38.956867" transform="rotate(-0 259.2 38.956867)">candidate call site (Modules A/B)</text>
   </g>
   <g id="text_3">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(96.723562 83.122312)">Operation site</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(25.235953 92.872312)">&lt;recv&gt;.sign / verify / exchange / encrypt / decrypt</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(83.921203 103.377937)">role ← method name</text>
   </g>
   <g id="text_4">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(20.736 146.368812)">Tier from evidence:</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(20.736 154.901938)">T0  receiver unresolved, no algorithm-specific arg.</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(20.736 164.151938)">T1  receiver typed as a key OR algorithm-specific arg.</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(20.736 174.118813)">T2  both</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(20.736 182.651938)">T3  T2 + receiver origin resolved to a concrete</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(20.736 191.901938)">       provenance, without conflict</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(20.736 201.151938)">any conflict → capped at T1</text>
   </g>
   <g id="text_5">
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(304.320562 83.122312)">Key-material site (keygen / loader / construct)</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(302.619187 92.872312)">bounded consumer tracing: aliases, attributes,</text>
    <text style="font-size: 7.8px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(329.945391 103.377937)">≤ 2 call levels within the module</text>
   </g>
   <g id="text_6">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(290.304 146.368812)">Consumers found:</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(290.304 154.901938)">1 family, no escape → that role, T3</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(290.304 164.151938)">1 family, escape → that role, T2</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(290.304 173.741297)">≥ 2 families → UNKNOWN, T2</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(290.304 182.483703)">none, no escape → KEY_MATERIAL_ONLY, T2</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(290.304 191.901938)">none, escape → single-purpose algorithm's role,</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(290.304 201.433484)">   T2 (X25519/X448/DH; Ed/DSA); else UNKNOWN, T1</text>
   </g>
   <g id="text_7">
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(186.400187 252.677937)">Policy v1.1 (threshold τ = T2), in order:</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(164.5725 261.927937)">1. role UNKNOWN → ABSTAIN (possible roles listed)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(170.247953 271.177937)">2. tier &lt; τ → ABSTAIN (missing evidence stated)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(111.520281 280.325031)">3. approved PQ/T hybrid component → FLAG_NO_TARGET (NO_ACTION_HYBRID)</text>
    <text style="font-size: 7.4px; font-family: 'DejaVu Sans'; fill: #0b0b0b" transform="translate(186.566109 289.677937)">4. otherwise class by role (table below)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="51.84" y="322.56" transform="rotate(-0 51.84 322.56)">SIGN, VERIFY</text>
   </g>
   <g id="text_9">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #0b0b0b" x="176.256" y="322.56" transform="rotate(-0 176.256 322.56)">SIG</text>
   </g>
   <g id="text_10">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="269.568" y="322.56" transform="rotate(-0 269.568 322.56)">RECOMMEND: ML-DSA (FIPS 204)</text>
   </g>
   <g id="text_11">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="51.84" y="336.672" transform="rotate(-0 51.84 336.672)">KEY_ESTABLISHMENT</text>
   </g>
   <g id="text_12">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #0b0b0b" x="176.256" y="336.672" transform="rotate(-0 176.256 336.672)">KEM</text>
   </g>
   <g id="text_13">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="269.568" y="336.672" transform="rotate(-0 269.568 336.672)">RECOMMEND: ML-KEM-based redesign (FIPS 203, SP 800-227)</text>
   </g>
   <g id="text_14">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="51.84" y="350.784" transform="rotate(-0 51.84 350.784)">PK_ENCRYPT, PK_DECRYPT</text>
   </g>
   <g id="text_15">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #0b0b0b" x="176.256" y="350.784" transform="rotate(-0 176.256 350.784)">KEM_DEM</text>
   </g>
   <g id="text_16">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="269.568" y="350.784" transform="rotate(-0 269.568 350.784)">RECOMMEND: KEM + KDF + AEAD redesign, not a drop-in</text>
   </g>
   <g id="text_17">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="51.84" y="364.896" transform="rotate(-0 51.84 364.896)">KEY_MATERIAL_ONLY</text>
   </g>
   <g id="text_18">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #0b0b0b" x="176.256" y="364.896" transform="rotate(-0 176.256 364.896)">INVENTORY</text>
   </g>
   <g id="text_19">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="269.568" y="364.896" transform="rotate(-0 269.568 364.896)">FLAG_NO_TARGET: inventory, find downstream role</text>
   </g>
   <g id="text_20">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #0b0b0b" x="51.84" y="379.008" transform="rotate(-0 51.84 379.008)">PROTOCOL_CONFIG*</text>
   </g>
   <g id="text_21">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans Mono'; text-anchor: start; fill: #0b0b0b" x="176.256" y="379.008" transform="rotate(-0 176.256 379.008)">PROTOCOL_REVIEW</text>
   </g>
   <g id="text_22">
    <text style="font-size: 7.6px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="269.568" y="379.008" transform="rotate(-0 269.568 379.008)">FLAG_NO_TARGET: protocol-library review</text>
   </g>
   <g id="text_23">
    <text style="font-size: 7px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #52514e" x="51.84" y="391.104" transform="rotate(-0 51.84 391.104)">* PROTOCOL_CONFIG is in the taxonomy and policy but is not emitted by Module C (stated limitation).</text>
   </g>
  </g>
